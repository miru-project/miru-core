syntax = "proto3";

package miru;

import "proto/common.proto";

option go_package = "github.com/miru-project/miru-core/proto";

// Dow
message GetDownloadStatusRequest {}
message GetDownloadStatusResponse {
  map<int32, DownloadProgress> download_status = 1;
}

message CancelDownloadRequest { int32 task_id = 1; }
message CancelDownloadResponse { string message = 1; }

message ResumeDownloadRequest { int32 task_id = 1; }
message ResumeDownloadResponse { string message = 1; }

message PauseDownloadRequest { int32 task_id = 1; }
message PauseDownloadResponse { string message = 1; }

message DownloadRequest {
  string url = 1;
  string download_path = 2;
  map<string, string> headers = 3;
  DownloadMediaType media_type = 4;
  string package = 5;
  string key = 6;
  string title = 7;
  string detail_url = 8;
  string watch_url = 9;
  // Content category (video / manga / novel) used for storage grouping.
  DownloadCategory category = 10;
}
message DownloadResponse {
  int32 task_id = 1;
  repeated AvailableHlsVariant variant_summary = 2;
  bool is_downloading = 3;
}

message GetAllDownloadsRequest {
  int32 page = 1;
  int32 page_size = 2;
}
message GetAllDownloadsResponse { repeated Download downloads = 1; }

message DeleteDownloadRequest { int32 id = 1; }
message DeleteDownloadResponse { string message = 1; }

message GetDownloadsByPackageAndDetailUrlRequest {
  string package = 1;
  string detail_url = 2;
}
message GetDownloadsByPackageAndDetailUrlResponse {
  repeated Download downloads = 1;
}

message GetDownloadByPackageWatchUrlDetailUrlRequest {
  string package = 1;
  string watch_url = 2;
  string detail_url = 3;
}
message GetDownloadByPackageWatchUrlDetailUrlResponse { Download download = 1; }
// Torrent
message ListTorrentRequest {}
message ListTorrentResponse { repeated TorrentResult torrents = 1; }

message AddTorrentRequest {
  string url = 1;
  string package = 2;
  string title = 3;
}
message AddTorrentResponse {
  string info_hash = 1;
  string detail_json = 2;
  repeated string files = 3;
}

message DeleteTorrentRequest { string info_hash = 1; }
message DeleteTorrentResponse { string message = 1; }

message AddMagnetRequest {
  string url = 1;
  string package = 2;
  string title = 3;
}
message AddMagnetResponse {
  string info_hash = 1;
  string detail_json = 2;
  repeated string files = 3;
}

service DownloadService {
  rpc GetDownloadStatus(GetDownloadStatusRequest)
      returns (GetDownloadStatusResponse);
  rpc CancelDownload(CancelDownloadRequest) returns (CancelDownloadResponse);
  rpc ResumeDownload(ResumeDownloadRequest) returns (ResumeDownloadResponse);
  rpc PauseDownload(PauseDownloadRequest) returns (PauseDownloadResponse);
  rpc Download(DownloadRequest) returns (DownloadResponse);
  rpc GetAllDownloads(GetAllDownloadsRequest) returns (GetAllDownloadsResponse);
  rpc DeleteDownload(DeleteDownloadRequest) returns (DeleteDownloadResponse);
  rpc GetDownloadsByPackageAndDetailUrl(
      GetDownloadsByPackageAndDetailUrlRequest)
      returns (GetDownloadsByPackageAndDetailUrlResponse);
  rpc GetDownloadByPackageWatchUrlDetailUrl(
      GetDownloadByPackageWatchUrlDetailUrlRequest)
      returns (GetDownloadByPackageWatchUrlDetailUrlResponse);

  // Torrent
  rpc ListTorrent(ListTorrentRequest) returns (ListTorrentResponse);
  rpc AddTorrent(AddTorrentRequest) returns (AddTorrentResponse);
  rpc DeleteTorrent(DeleteTorrentRequest) returns (DeleteTorrentResponse);
  rpc AddMagnet(AddMagnetRequest) returns (AddMagnetResponse);

  rpc UpdateDownloadStatus(UpdateDownloadStatusRequest)
      returns (UpdateDownloadStatusResponse);

  // Concurrency-limited scheduler controls.
  rpc SetDownloadPriority(SetDownloadPriorityRequest)
      returns (SetDownloadPriorityResponse);
  rpc SetDownloadConcurrent(SetDownloadConcurrentRequest)
      returns (SetDownloadConcurrentResponse);
  rpc ReorderDownloads(ReorderDownloadsRequest)
      returns (ReorderDownloadsResponse);

  // Returns per-category storage usage for the given download path, including
  // bytes occupied by in-progress (temp) downloads.
  rpc GetStorageStats(GetStorageStatsRequest)
      returns (GetStorageStatsResponse);
}

// StorageStats groups occupied bytes by content category plus temp downloads.
message StorageStats {
  int64 video_bytes = 1;
  int64 manga_bytes = 2;
  int64 novel_bytes = 3;
  // Bytes occupied by in-progress downloads (partial files not yet completed).
  int64 temp_bytes = 4;
  // Total of video + manga + novel + temp.
  int64 total_bytes = 5;
}

message GetStorageStatsRequest {
  string download_path = 1;
}

message GetStorageStatsResponse {
  StorageStats stats = 1;
}

message SetDownloadPriorityRequest { int32 task_id = 1; int32 priority = 2; }
message SetDownloadPriorityResponse { string message = 1; }

message SetDownloadConcurrentRequest { int32 max_concurrent = 1; }
message SetDownloadConcurrentResponse { string message = 1; }

// Reorders active/queued tasks. `ordered_task_ids` is the full desired order
// (front = highest priority). The backend reassigns priorities accordingly.
message ReorderDownloadsRequest { repeated int32 ordered_task_ids = 1; }
message ReorderDownloadsResponse { string message = 1; }

message UpdateDownloadStatusRequest {
  int32 task_id = 1;
  DownloadStatus status = 2;
  optional string save_path = 3;
  // Optional failure reason reported by the frontend (e.g. FFmpeg
  // conversion failed). Only meaningful with status FAILED.
  optional string error = 4;
}

message UpdateDownloadStatusResponse { string message = 1; }